name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: make lint test build
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: make integration
  grafana-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        grafana-version: ["12.2.0", "13.0.11", "13.2.4"]
    env:
      GRAFANA_TEST_VERSION: ${{ matrix.grafana-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: make grafana-integration
